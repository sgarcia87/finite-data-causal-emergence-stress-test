name: smoke-test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  syntax-and-figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m py_compile src/final_emergence_stress_benchmark.py scripts/make_figures.py
      - run: python scripts/make_figures.py
